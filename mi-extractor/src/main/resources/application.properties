spring.application.name=mi-extractor
# Permitir archivos de hasta 50MB (ajusta si tus libros son más pesados)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Raiz unica para todas las carpetas temporales (barrible con seguridad por CleanupTask)
app.storage.tmp-dir=${java.io.tmpdir}/mi-extractor
# Antiguedad maxima (horas) antes de borrar temporales y trabajos viejos
app.storage.tmp-ttl-hours=24
# Tope GLOBAL de navegadores Chrome simultaneos (protege la RAM). Tu eliges cuantos
# hilos usar, pero nunca se superan estos; sube/baja este numero segun tu maquina.
app.scraper.max-navegadores=10
# Rutas de ChromeDriver según el sistema operativo
webdriver.chrome.path.windows=mi-extractor/drivers/chromedriver.exe
webdriver.chrome.path.linux=mi-extractor/drivers/chromedriver-linux
# Ejecutable de Calibre (para CONVERTIR_V3). Defecto = instalacion tipica en Windows.
# En el perfil 'prod' se sobreescribe (o se deja vacio para desactivar la conversion).
app.calibre.path=C:\\Program Files\\Calibre2\\ebook-convert.exe
# Carpeta donde se dejan las salidas que NO se entregan por /download (REEMPAQUETAR, INICIO_LIBRO).
# Defecto = Descargas del usuario (comportamiento historico en local).
app.storage.output-dir=${user.home}/Downloads