# ============================================================================
#  Perfil de PRODUCCION (VPS / Docker Linux). Se activa con:
#     SPRING_PROFILES_ACTIVE=prod
#  Solo sobreescribe lo que cambia respecto a application.properties.
#  NADA de rutas de Windows ni carpetas personales aqui.
# ============================================================================

# Almacenamiento bajo /data (monta un volumen ahi para que persista).
app.storage.tmp-dir=/data/tmp
app.storage.output-dir=/data/salidas

# ChromeDriver: en la imagen NO hay binario (lo excluye .dockerignore). Scraper intenta
# primero un driver local; al no encontrar ningun fichero, Selenium Manager descarga el
# que corresponda a la version de Chrome instalada y lo cachea en SE_CACHE_PATH (definido
# en el Dockerfile). No hay nada que configurar aqui: basta con que el fichero no exista.

# Calibre: si lo instalas en la imagen, apunta aqui su ejecutable (p. ej. /usr/bin/ebook-convert).
# Vacio = CONVERTIR_V3 queda desactivado y responde con error claro en vez de fingir exito.
app.calibre.path=

# Tope de navegadores: ajusta segun la RAM del VPS (cada Chrome headless ~150-300 MB).
app.scraper.max-navegadores=4
