spring.application.name=mi-extractor
# Permitir archivos de hasta 50MB (ajusta si tus libros son más pesados)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Raiz unica para todas las carpetas temporales (barrible con seguridad por CleanupTask)
app.storage.tmp-dir=${java.io.tmpdir}/mi-extractor
# Antiguedad maxima (horas) antes de borrar temporales y trabajos viejos
app.storage.tmp-ttl-hours=24
# Rutas de ChromeDriver según el sistema operativo
webdriver.chrome.path.windows=mi-extractor/drivers/chromedriver.exe
webdriver.chrome.path.linux=mi-extractor/drivers/chromedriver-linux